<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Alerts - Demand Forecast System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="container navbar-content">
            <a href="dashboard.html" class="logo">📊 Demand Forecast</a>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="data-upload.html">Data</a></li>
                <li><a href="forecasting.html">Forecasting</a></li>
                <li><a href="instock.html">Stock</a></li>
                <li><a href="optimization.html">Optimization</a></li>
                <li><a href="inventory.html" class="active">Alerts</a></li>
                <li><a href="reports.html">Reports</a></li>
            </ul>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button class="theme-toggle" onclick="toggleDarkMode()">🌓</button>
                <span id="username" style="color: var(--text-secondary);"></span>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Inventory Intelligence</h1>
            <button class="btn btn-primary" onclick="generateAlerts()">Generate Alerts</button>
        </div>

        <div id="alert-container"></div>

        <!-- Alert Filters -->
        <div class="card" style="margin-bottom: 2rem;">
            <div class="grid grid-3">
                <div class="form-group">
                    <label class="form-label">Alert Type</label>
                    <select id="alertType" class="form-select" onchange="loadAlerts()">
                        <option value="">All Types</option>
                        <option value="low_stock">Low Stock</option>
                        <option value="overstock">Overstock</option>
                        <option value="reorder">Reorder</option>
                        <option value="anomaly">Anomaly</option>
                        <option value="offer_recommendation">🏷️ Offer Recommendation</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Severity</label>
                    <select id="severity" class="form-select" onchange="loadAlerts()">
                        <option value="">All Severities</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select id="isRead" class="form-select" onchange="loadAlerts()">
                        <option value="">All</option>
                        <option value="false">Unread</option>
                        <option value="true">Read</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Alerts List -->
        <div id="alertsList"></div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/inventory.js"></script>
</body>

</html>
