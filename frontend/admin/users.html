<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin Panel</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="admin-body">

    <!-- Sidebar (Same as dashboard) -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <a href="dashboard.html" class="sidebar-logo">📊 Admin Panel</a>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="icon-dashboard"></span> Dashboard
            </a>
            <a href="users.html" class="nav-item active">
                <span class="icon-users"></span> User Management
            </a>
            <a href="products.html" class="nav-item">
                <span class="icon-products"></span> Product Management
            </a>
            <a href="inventory.html" class="nav-item">
                <span class="icon-inventory"></span> Inventory Control
            </a>
            <a href="sales.html" class="nav-item">
                <span class="icon-sales"></span> Sales History
            </a>
            <a href="forecasting.html" class="nav-item">
                <span class="icon-forecast"></span> Forecast Tools
            </a>
            <a href="alerts.html" class="nav-item">
                <span class="icon-alerts"></span> Alert Center
            </a>
            <a href="reports.html" class="nav-item">
                <span class="icon-reports"></span> System Reports
            </a>
            <a href="settings.html" class="nav-item">
                <span class="icon-settings"></span> System Settings
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" onclick="logout()" class="nav-item" style="color: #f87171;">
                <span>🚪</span> Logout
            </a>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-navbar">
            <h2 id="page-title">User Management</h2>
            <div class="align-center d-flex gap-2">
                <button class="theme-toggle" onclick="toggleDarkMode()">🌓</button>
                <div class="d-flex align-center gap-2">
                    <span id="admin-name" style="font-weight: 600;">Admin User</span>
                    <div
                        style="width: 40px; height: 40px; background: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700;">
                        A</div>
                </div>
            </div>
        </header>

        <div class="admin-content fade-in">
            <div id="alert-container"></div>
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3 class="admin-card-title">All System Users</h3>
                    <div class="d-flex gap-2">
                        <input type="text" id="userSearch" placeholder="Search Users..." class="form-input"
                            style="width: 250px;">
                        <button class="btn btn-primary" onclick="showUserModal()">+ Add User</button>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Last Activity</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- User Edit/Add Modal -->
        <div id="userModal" class="modal-overlay" style="display: none;">
            <div class="admin-card modal-content" style="max-width: 500px; width: 90%; margin: 50px auto;">
                <div class="admin-card-header">
                    <h3 class="admin-card-title" id="modalTitle">Edit User</h3>
                    <button class="btn-close" onclick="closeUserModal()">&times;</button>
                </div>
                <div class="admin-content">
                    <form id="userForm">
                        <input type="hidden" id="editUserId">
                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" id="modalUsername" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="modalEmail" class="form-input" required>
                        </div>
                        <div class="form-group" id="passwordGroup">
                            <label class="form-label">Password</label>
                            <input type="password" id="modalPassword" class="form-input"
                                placeholder="Enter password (for new users)">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Role</label>
                            <select id="modalRole" class="form-select">
                                <option value="user">USER</option>
                                <option value="admin">ADMIN</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
                            <button type="button" class="btn btn-secondary" onclick="closeUserModal()">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .btn-close:hover {
            color: var(--danger-color);
        }
    </style>

    <script src="../js/utils.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        let allUsers = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
            document.getElementById('userForm').addEventListener('submit', saveUser);

            // Search implementation
            document.getElementById('userSearch').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allUsers.filter(u =>
                    u.username.toLowerCase().includes(term) ||
                    u.email.toLowerCase().includes(term)
                );
                renderUsers(filtered);
            });
        });

        async function loadUsers() {
            try {
                const users = await apiRequest('/admin/users');
                allUsers = users;
                renderUsers(users);
            } catch (err) {
                console.error('Failed to load users:', err);
                showAlert('Failed to load users: ' + err.message, 'danger');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = users.map(user => {
                const onlineStatus = user.isOnline
                    ? '<span class="badge badge-success" style="display: flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 8px; background: white; border-radius: 50%; display: inline-block;"></span> ONLINE</span>'
                    : '<span class="badge badge-secondary" style="background: #94a3b8; color: white;">OFFLINE</span>';

                const accountStatus = user.active === false
                    ? '<span class="badge badge-danger">REVOKED</span>'
                    : '<span class="badge badge-success">ACTIVE</span>';

                const lastLoginStr = user.lastLogin
                    ? new Date(user.lastLogin).toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' })
                    : 'Never';

                return `
                    <tr>
                        <td>
                            <div style="font-weight: 600;">${user.username}</div>
                            <div style="font-size: 0.75rem; color: var(--text-secondary);">Joined: ${formatDate(user.createdAt)}</div>
                        </td>
                        <td>${user.email}</td>
                        <td><span class="badge ${user.role === 'admin' ? 'badge-info' : 'badge-success'}">${user.role.toUpperCase()}</span></td>
                        <td>
                            <div class="d-flex flex-column gap-1">
                                ${onlineStatus}
                                ${accountStatus}
                            </div>
                        </td>
                        <td><span style="font-size: 0.875rem;">${lastLoginStr}</span></td>
                        <td>
                            <div class="d-flex gap-2">
                                <button class="btn btn-secondary btn-sm" onclick="editUser('${user._id}')">Edit</button>
                                <button class="btn btn-${user.active === false ? 'success' : 'warning'} btn-sm" onclick="toggleUserStatus('${user._id}', ${user.active !== false})">
                                    ${user.active === false ? 'Restore' : 'Revoke'}
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="deleteUser('${user._id}')">Remove</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function showUserModal(userData = null) {
            const modal = document.getElementById('userModal');
            const form = document.getElementById('userForm');
            const passwordGroup = document.getElementById('passwordGroup');

            form.reset();

            if (userData) {
                document.getElementById('modalTitle').textContent = 'Edit User';
                document.getElementById('editUserId').value = userData._id;
                document.getElementById('modalUsername').value = userData.username;
                document.getElementById('modalEmail').value = userData.email;
                document.getElementById('modalRole').value = userData.role;
                passwordGroup.style.display = 'none'; // Don't show password for edit
                document.getElementById('modalPassword').required = false;
            } else {
                document.getElementById('modalTitle').textContent = 'Add New User';
                document.getElementById('editUserId').value = '';
                passwordGroup.style.display = 'block';
                document.getElementById('modalPassword').required = true;
            }

            modal.style.display = 'flex';
        }

        function closeUserModal() {
            document.getElementById('userModal').style.display = 'none';
        }

        async function saveUser(e) {
            e.preventDefault();
            const id = document.getElementById('editUserId').value;
            const isEdit = !!id;

            const body = {
                username: document.getElementById('modalUsername').value,
                email: document.getElementById('modalEmail').value,
                role: document.getElementById('modalRole').value
            };

            if (!isEdit) {
                body.password = document.getElementById('modalPassword').value;
            }

            try {
                const endpoint = isEdit ? `/admin/users/${id}` : '/auth/signup';
                const method = isEdit ? 'PUT' : 'POST';

                await apiRequest(endpoint, {
                    method,
                    body: JSON.stringify(body)
                });

                showAlert(`User ${isEdit ? 'updated' : 'created'} successfully`, 'success');
                closeUserModal();
                loadUsers();
            } catch (err) {
                showAlert(err.message, 'danger');
            }
        }

        async function editUser(id) {
            const user = allUsers.find(u => u._id === id);
            if (user) showUserModal(user);
        }

        async function toggleUserStatus(id, currentlyActive) {
            const action = currentlyActive ? 'revoke access for' : 'restore access for';
            if (confirm(`Are you sure you want to ${action} this account?`)) {
                try {
                    await apiRequest(`/admin/users/${id}`, {
                        method: 'PUT',
                        body: JSON.stringify({ active: !currentlyActive })
                    });
                    showAlert('User status updated', 'success');
                    loadUsers();
                } catch (err) {
                    showAlert(err.message, 'danger');
                }
            }
        }

        async function deleteUser(id) {
            if (confirm('CRITICAL: Are you sure you want to PERMANENTLY REMOVE this user? All their data may be affected.')) {
                try {
                    await apiRequest(`/admin/users/${id}`, { method: 'DELETE' });
                    showAlert('User removed from system', 'success');
                    loadUsers();
                } catch (err) {
                    showAlert(err.message, 'danger');
                }
            }
        }
    </script>
</body>

</html>
