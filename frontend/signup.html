<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Demand Forecast System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <h1 class="auth-title">📊 Demand Forecast</h1>
                <p class="auth-subtitle">Create your account</p>
            </div>

            <br>
            <div id="debug-status"
                style="padding: 10px; background: #f0f0f0; border: 1px solid #ccc; font-family: monospace; font-size: 12px; margin-bottom: 15px; display: block;">
                Debug Status: Ready
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="johndoe" required minlength="3">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required
                        minlength="6">
                    <small style="color: var(--text-secondary); font-size: 0.75rem;">Minimum 6 characters</small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">Account Type</label>
                    <select id="role" class="form-select" required>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Create Account
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.875rem;">
                Already have an account?
                <a href="index.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign
                    in</a>
            </p>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function logDebug(msg) {
            const status = document.getElementById('debug-status');
            status.innerHTML += '<br>' + msg;
            console.log(msg);
        }

        // Test connectivity on load
        window.addEventListener('load', async () => {
            logDebug('Page loaded. Checking server...');
            try {
                const start = Date.now();
                const res = await fetch('http://localhost:5000/api/health?t=' + start);
                logDebug('Server health check: ' + res.status);
            } catch (e) {
                logDebug('ERROR: Cannot reach server! ' + e.message);
                logDebug('Make sure backend is running on port 5000');
            }
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            logDebug('Form submitted. Collecting data...');

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            try {
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;

                logDebug(`Data: ${username}, ${email}, ${role}`);
                logDebug('Calling signup function...');

                await signup(username, email, password, role);
                logDebug('Signup function execution completed.');
            } catch (err) {
                logDebug('CRITICAL ERROR in form handler: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>

</html>
